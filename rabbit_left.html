<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxing Rabbit — Left</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ff00ff; }
    .stage {
      width: 512px; height: 512px; position: relative; margin: 0 auto;
      background: #ff00ff;
    }
    .rabbit {
      position: absolute; left: 50%; top: 54%; width: 280px; height: 320px;
      transform: translate(-50%, -50%);
    }
    .rabbit svg { width: 100%; height: 100%; overflow: visible; display: block; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="rabbit" id="rabbit">
      <svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" aria-label="Boxing rabbit facing left">
        <defs>
          <radialGradient id="fur" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f7f0e6" /><stop offset="55%" stop-color="#e8d5b8" /><stop offset="100%" stop-color="#c9a87c" />
          </radialGradient>
          <radialGradient id="belly" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff8ef" /><stop offset="100%" stop-color="#f0e2cc" />
          </radialGradient>
          <linearGradient id="gloveRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5a5a" /><stop offset="45%" stop-color="#e12222" /><stop offset="100%" stop-color="#9b0f0f" />
          </linearGradient>
          <linearGradient id="gloveShade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" /><stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
          </linearGradient>
          <linearGradient id="innerEar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb7c5" /><stop offset="100%" stop-color="#f07a92" />
          </linearGradient>
        </defs>

        <!-- far leg -->
        <ellipse cx="155" cy="278" rx="22" ry="16" fill="#b8956a" stroke="#8a6a45" stroke-width="2.5" />
        <!-- near leg -->
        <ellipse cx="125" cy="282" rx="26" ry="17" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
        <ellipse cx="112" cy="285" rx="9" ry="5" fill="#d4b896" />

        <!-- far arm + glove (behind) -->
        <ellipse cx="95" cy="200" rx="14" ry="26" fill="#b8956a" stroke="#8a6a45" stroke-width="2.5" transform="rotate(-40 95 200)" />
        <g transform="translate(48, 215) rotate(-35)">
          <ellipse cx="20" cy="22" rx="24" ry="20" fill="#c41a1a" stroke="#6b0a0a" stroke-width="2.5" />
          <rect x="6" y="0" width="22" height="12" rx="5" fill="#eee" stroke="#888" stroke-width="1.5" />
        </g>

        <!-- body profile -->
        <ellipse cx="145" cy="210" rx="48" ry="70" fill="url(#fur)" stroke="#8a6a45" stroke-width="3" />
        <ellipse cx="128" cy="218" rx="22" ry="42" fill="url(#belly)" />

        <!-- near arm + glove (guarding forward-left) -->
        <ellipse cx="100" cy="195" rx="16" ry="28" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" transform="rotate(-50 100 195)" />
        <g transform="translate(35, 200) rotate(-10)">
          <ellipse cx="24" cy="28" rx="30" ry="26" fill="url(#gloveRed)" stroke="#6b0a0a" stroke-width="2.5" />
          <ellipse cx="24" cy="28" rx="30" ry="26" fill="url(#gloveShade)" />
          <rect x="10" y="0" width="28" height="15" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="2" />
          <ellipse cx="2" cy="24" rx="11" ry="9" fill="url(#gloveRed)" stroke="#6b0a0a" stroke-width="2" />
        </g>

        <!-- head profile left -->
        <g id="head">
          <!-- ears: one visible prominently -->
          <g transform="rotate(-18 150 70)">
            <ellipse cx="155" cy="50" rx="16" ry="52" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
            <ellipse cx="155" cy="52" rx="8" ry="36" fill="url(#innerEar)" />
          </g>
          <ellipse cx="148" cy="55" rx="12" ry="40" fill="#b8956a" stroke="#8a6a45" stroke-width="2" opacity="0.85" transform="rotate(8 148 55)" />

          <ellipse cx="130" cy="125" rx="48" ry="46" fill="url(#fur)" stroke="#8a6a45" stroke-width="3" />
          <!-- snout -->
          <ellipse cx="88" cy="135" rx="22" ry="16" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
          <!-- eye -->
          <ellipse cx="108" cy="118" rx="8" ry="10" fill="#1a1a1a" />
          <circle cx="110" cy="114" r="2.8" fill="#ffffff" />
          <path d="M98 102 Q108 96 118 102" fill="none" stroke="#6b4e2e" stroke-width="3" stroke-linecap="round" />
          <!-- nose tip -->
          <ellipse cx="70" cy="135" rx="7" ry="6" fill="#3a2a1a" />
          <ellipse cx="68" cy="133" rx="2" ry="1.5" fill="#ffffff" opacity="0.45" />
          <path d="M78 145 Q88 150 95 144" fill="none" stroke="#5a4030" stroke-width="2" stroke-linecap="round" />
          <!-- whiskers -->
          <g stroke="#8a6a45" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
            <line x1="78" y1="140" x2="45" y2="132" />
            <line x1="78" y1="146" x2="42" y2="146" />
            <line x1="78" y1="152" x2="48" y2="160" />
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
