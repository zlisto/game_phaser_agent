<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxing Rabbit — Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ff00ff; }
    .stage {
      width: 512px; height: 512px; position: relative; margin: 0 auto;
      background: #ff00ff;
    }
    .rabbit {
      position: absolute; left: 50%; top: 54%; width: 280px; height: 320px;
      transform: translate(-50%, -50%);
    }
    .rabbit svg { width: 100%; height: 100%; overflow: visible; display: block; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="rabbit" id="rabbit">
      <svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" aria-label="Boxing rabbit facing up">
        <defs>
          <radialGradient id="fur" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f7f0e6" /><stop offset="55%" stop-color="#e8d5b8" /><stop offset="100%" stop-color="#c9a87c" />
          </radialGradient>
          <linearGradient id="gloveRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5a5a" /><stop offset="45%" stop-color="#e12222" /><stop offset="100%" stop-color="#9b0f0f" />
          </linearGradient>
          <linearGradient id="gloveShade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" /><stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
          </linearGradient>
          <linearGradient id="innerEar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb7c5" /><stop offset="100%" stop-color="#f07a92" />
          </linearGradient>
        </defs>

        <!-- legs -->
        <ellipse cx="105" cy="278" rx="28" ry="18" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
        <ellipse cx="175" cy="278" rx="28" ry="18" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />

        <!-- arms + gloves behind body (back view) -->
        <g id="arm-left">
          <ellipse cx="68" cy="200" rx="16" ry="28" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" transform="rotate(-20 68 200)" />
          <g transform="translate(30, 215) rotate(-25)">
            <ellipse cx="22" cy="26" rx="28" ry="24" fill="url(#gloveRed)" stroke="#6b0a0a" stroke-width="2.5" />
            <ellipse cx="22" cy="26" rx="28" ry="24" fill="url(#gloveShade)" />
            <rect x="8" y="0" width="26" height="14" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="2" />
          </g>
        </g>
        <g id="arm-right">
          <ellipse cx="212" cy="200" rx="16" ry="28" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" transform="rotate(20 212 200)" />
          <g transform="translate(200, 215) rotate(25)">
            <ellipse cx="22" cy="26" rx="28" ry="24" fill="url(#gloveRed)" stroke="#6b0a0a" stroke-width="2.5" />
            <ellipse cx="22" cy="26" rx="28" ry="24" fill="url(#gloveShade)" />
            <rect x="8" y="0" width="26" height="14" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="2" />
          </g>
        </g>

        <!-- body (back — no belly) -->
        <g id="body">
          <ellipse cx="140" cy="210" rx="62" ry="72" fill="url(#fur)" stroke="#8a6a45" stroke-width="3" />
          <!-- spine hint -->
          <ellipse cx="140" cy="205" rx="8" ry="40" fill="#000000" opacity="0.06" />
        </g>

        <!-- head from behind -->
        <g id="head">
          <ellipse cx="140" cy="120" rx="58" ry="52" fill="url(#fur)" stroke="#8a6a45" stroke-width="3" />
          <!-- ears in front of head (back view — ears toward camera tops) -->
          <g id="ear-left" transform="rotate(-8 100 70)">
            <ellipse cx="100" cy="48" rx="18" ry="54" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
            <ellipse cx="100" cy="48" rx="8" ry="34" fill="url(#innerEar)" opacity="0.35" />
          </g>
          <g id="ear-right" transform="rotate(8 180 70)">
            <ellipse cx="180" cy="48" rx="18" ry="54" fill="url(#fur)" stroke="#8a6a45" stroke-width="2.5" />
            <ellipse cx="180" cy="48" rx="8" ry="34" fill="url(#innerEar)" opacity="0.35" />
          </g>
          <!-- nape / back-of-head fluff -->
          <ellipse cx="140" cy="145" rx="30" ry="16" fill="#000000" opacity="0.07" />
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
